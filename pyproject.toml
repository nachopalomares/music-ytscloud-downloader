[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ytscloud"
version = "0.1.0"
description = "A local CLI for downloading tracklists from YouTube Music and SoundCloud"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.16"
authors = [
    { name = "Ytscloud Contributors" }
]
keywords = [
    "spotify",
    "soundcloud",
    "youtube-music",
    "downloader",
    "audio",
    "tracklist",
    "dj",
    "cli",
    "mp3",
    "wav",
    "ytscloud"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "spotdl>=4.6,<5",
    "yt-dlp[default]>=2026.10.21,<2027",
    "ytmusicapi>=1.12.1,!=1.12.2,!=1.12.3,<2",
]

[project.scripts]
ytscloud = "ytscloud:main"

[project.urls]
Homepage = "https://github.com/nachopalomares/music-ytscloud-downloader"
Repository = "https://github.com/nachopalomares/music-ytscloud-downloader.git"
Issues = "https://github.com/nachopalomares/music-ytscloud-downloader/issues"

[tool.setuptools]
py-modules = ["ytscloud"]
